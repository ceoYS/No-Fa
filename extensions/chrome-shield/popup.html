<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>NoF 실드 (프로토타입)</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        background: #14110f;
        color: #f3ece6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
          "Noto Sans KR", sans-serif;
        line-height: 1.55;
      }
      h1 { font-size: 16px; margin: 0 0 2px; }
      .tag { font-size: 11px; color: #e8854a; margin: 0 0 12px; }
      p { font-size: 13px; margin: 0 0 10px; }
      .quiet { color: #b6aaa0; font-size: 12px; }
      code {
        display: inline-block;
        background: rgba(232, 133, 74, 0.16);
        border: 1px solid rgba(232, 133, 74, 0.4);
        color: #e8854a;
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 12px;
      }
      button {
        width: 100%;
        margin-top: 6px;
        border: 1px solid rgba(182, 170, 160, 0.35);
        background: transparent;
        color: #f3ece6;
        border-radius: 10px;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>NoF 실드</h1>
    <p class="tag">로컬 Chrome 전용 프로토타입</p>
    <p>해롭지 않은 테스트 신호 하나만 막아요. 실제 사이트 차단 엔진이 아니에요.</p>
    <p class="quiet">테스트 신호: <code id="test-signal">…</code></p>
    <p class="quiet">검색이나 탭 이동에 이 문구가 들어가면 ‘잠깐 멈춤’ 페이지로 이어져요.</p>
    <button id="open-options" type="button">설정 열기</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
